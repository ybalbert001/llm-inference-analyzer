<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Inference Analyzer</title>
<style>
  :root {
    --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --ring:rgba(11,11,11,.10); --accent:#2a78d6; --err:#e34948; --ok:#1baf7a;
  }
  @media (prefers-color-scheme: dark) { :root {
    --surface:#1a1a19; --page:#0d0d0d; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --ring:rgba(255,255,255,.10); --accent:#3987e5; --err:#e66767; --ok:#199e70;
  } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--page); color:var(--ink);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:40px 24px 64px }
  h1 { font-size:24px; font-weight:600; margin:0 }
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px }
  .subtitle { color:var(--ink2); margin:0 0 24px }
  .userbox { font-size:13px; color:var(--ink2) }
  .userbox a { color:var(--accent); text-decoration:none }
  .searchrow { display:flex; gap:10px; margin-bottom:20px }
  input[type=text] { flex:1; font:inherit; padding:10px 14px; border:1px solid var(--grid);
    border-radius:10px; background:var(--surface); color:var(--ink); outline:none }
  input[type=text]:focus { border-color:var(--accent) }
  select { font:inherit; padding:10px; border:1px solid var(--grid); border-radius:10px;
    background:var(--surface); color:var(--ink) }
  button { font:inherit; font-weight:600; padding:10px 18px; border:none; border-radius:10px;
    background:var(--ink); color:var(--page); cursor:pointer }
  button:disabled { opacity:.5; cursor:default }
  .card { background:var(--surface); border:1px solid var(--ring); border-radius:12px;
    padding:14px 18px; margin-bottom:10px; display:flex; align-items:center; gap:14px }
  .card a.title { font-weight:600; color:var(--ink); text-decoration:none; font-size:15px }
  .card a.title:hover { color:var(--accent) }
  .card .meta { color:var(--muted); font-size:12.5px; margin-left:auto; text-align:right; flex-shrink:0 }
  .langtag { font-size:11px; font-weight:600; color:var(--ink2); border:1px solid var(--grid);
    border-radius:5px; padding:1px 6px }
  .tabs { display:flex; gap:12px; margin-left:0; font-size:12.5px }
  .tabs a { color:var(--muted); text-decoration:none }
  .tabs a:hover { color:var(--accent) }
  #genbox { background:var(--surface); border:1px dashed var(--grid); border-radius:12px;
    padding:20px; text-align:center; margin-top:8px; display:none }
  #genbox p { margin:0 0 12px; color:var(--ink2) }
  #genstatus { margin-top:12px; font-size:13px }
  #genstatus.err { color:var(--err); white-space:pre-wrap; text-align:left }
  #genstatus.ok { color:var(--ok) }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--grid);
    border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite;
    vertical-align:-2px; margin-right:6px }
  @keyframes spin { to { transform:rotate(360deg) } }
  .empty { color:var(--muted); text-align:center; padding:32px 0 }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>LLM Inference Analyzer</h1>
    <div class="userbox">
      {% if username %}
        <b>{{ username }}</b>{% if not dev_mode %} · <a href="/logout">退出</a>{% endif %}
      {% else %}
        <a href="/login">使用 Hugging Face 登录</a>
      {% endif %}
    </div>
  </div>
  <p class="subtitle">显存拆解 · 并行切分 · Roofline 性能上界 —— 输入 HuggingFace model ID 检索或生成分析报告</p>

  <div class="searchrow">
    <input type="text" id="q" placeholder="搜索或输入 model ID，如 Qwen/Qwen3-32B" autofocus>
    <select id="lang"><option value="zh">中文</option><option value="en">EN</option></select>
  </div>

  <div id="list"></div>

  <div id="genbox">
    <p>没有找到 <b id="genmodel"></b> 的报告</p>
    <button id="genbtn">生成分析报告</button>
    <div id="genstatus"></div>
  </div>
</div>

<script>
const LOGGED_IN = {{ 'true' if username else 'false' }};
let reports = [];

function fmtSize(b) { return (b/1048576).toFixed(1) + ' MB'; }

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const hits = reports.filter(r => !q || r.model_id.toLowerCase().includes(q) || r.slug.includes(q));
  list.innerHTML = hits.map(r => `
    <div class="card">
      <a class="title" href="/reports/${r.slug}.html">${r.model_id}</a>
      <span class="langtag">${r.lang}</span>
      <span class="tabs">
        <a href="/reports/${r.slug}.html#estimate">显存</a>
        <a href="/reports/${r.slug}.html#parallel">并行</a>
        <a href="/reports/${r.slug}.html#roofline">roofline</a>
      </span>
      <span class="meta">${r.created_at.slice(0,10)} · ${fmtSize(r.size_bytes)}</span>
    </div>`).join('') || (q ? '' : '<div class="empty">还没有任何报告</div>');

  const genbox = document.getElementById('genbox');
  const looksLikeId = /^[\w.-]+\/[\w.-]+$/.test(document.getElementById('q').value.trim());
  const exact = hits.some(r => r.model_id.toLowerCase() === q);
  if (q && looksLikeId && !exact) {
    document.getElementById('genmodel').textContent = document.getElementById('q').value.trim();
    genbox.style.display = 'block';
  } else {
    genbox.style.display = 'none';
  }
}

async function load() {
  reports = await (await fetch('/api/reports')).json();
  render();
}

document.getElementById('q').addEventListener('input', render);

document.getElementById('genbtn').addEventListener('click', async () => {
  if (!LOGGED_IN) { location.href = '/login'; return; }
  const modelId = document.getElementById('q').value.trim();
  const lang = document.getElementById('lang').value;
  const btn = document.getElementById('genbtn');
  const st = document.getElementById('genstatus');
  btn.disabled = true;
  st.className = ''; st.innerHTML = '<span class="spinner"></span>提交中…';
  try {
    const resp = await fetch('/api/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model_id: modelId, lang}),
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    if (data.status === 'cached') { location.href = `/reports/${data.slug}.html`; return; }
    st.innerHTML = '<span class="spinner"></span>生成中（读取 config.json 与 safetensors headers，约需十几秒）…';
    const poll = setInterval(async () => {
      const t = await (await fetch(`/api/tasks/${data.task_id}`)).json();
      if (t.status === 'done') {
        clearInterval(poll);
        st.className = 'ok'; st.textContent = '完成，正在跳转…';
        location.href = `/reports/${t.slug}.html`;
      } else if (t.status === 'failed') {
        clearInterval(poll);
        btn.disabled = false;
        st.className = 'err'; st.textContent = '生成失败：\n' + t.error;
      }
    }, 2000);
  } catch (e) {
    btn.disabled = false;
    st.className = 'err'; st.textContent = String(e.message || e);
  }
});

load();
</script>
</body>
</html>
